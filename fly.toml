# fly.toml app configuration file generated for preppilot-backend on 2026-05-16T00:37:13+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'preppilot-backend'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  ANTHROPIC_MODEL = 'claude-sonnet-4-6'
  LOG_LEVEL = 'info'
  MODELS_DIR = '/app/models'
  OPENAI_MODEL = 'gpt-5.4-nano'
  PYTHONUNBUFFERED = '1'
  SANDBOX_TIMEOUT_SECONDS = '60'
  LOKY_MAX_CPU_COUNT = '1'
  JOBLIB_MULTIPROCESSING = '0'
  OMP_NUM_THREADS = '1'
  MKL_NUM_THREADS = '1'

[[mounts]]
  source = 'preppilot_models'
  destination = '/app/models'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 25

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
